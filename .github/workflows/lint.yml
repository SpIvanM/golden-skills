name: CI & Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Markdown files exist and are not empty
        run: |
          for file in rc/SKILL.md rc/SKILL_RU.md rca/SKILL.md rca/SKILL_RU.md human-requirements/SKILL.md human-requirements/SKILL_RU.md README.md README_RU.md; do
            if [ ! -s "$file" ]; then
              echo "Error: $file is missing or empty"
              exit 1
            fi
            echo "✓ $file verified"
          done
